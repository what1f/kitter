[package]
name = "kitter"
version = "0.1.3"
edition = "2024"
description = "Native Agent Skill manager"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/what1f/kitter"
homepage = "https://github.com/what1f/kitter"

[features]
default = []
desktop = [
    "dep:gpui",
    "dep:gpui_platform",
    "dep:gpui-component",
    "dep:gpui-base",
    "dep:gpui-component-assets",
]
ui-test = ["desktop", "gpui/test-support"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
gpui = { git = "https://github.com/zed-industries/zed", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11", "runtime_shaders"], optional = true }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "c27f5d5c8f70d534978c2f0739ad9e10d4e41eb4", optional = true }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "c27f5d5c8f70d534978c2f0739ad9e10d4e41eb4", optional = true }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "c27f5d5c8f70d534978c2f0739ad9e10d4e41eb4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sys-locale = "0.3.2"
tempfile = "3.20"
walkdir = "2.5"
ignore = "0.4"

[target.'cfg(windows)'.dependencies]
junction = "2.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSGraphics",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
raw-window-handle = "0.6"

[[bin]]
name = "kitter"
path = "src/bin/kitter.rs"

[[bin]]
name = "kitter-desktop"
path = "src/bin/kitter-desktop.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# GPUI only needs no-op instrumentation in Kitter builds. Keep this Apache-2.0
# shim until upstream makes its tracing dependency optional.
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "crates/ztracing-shim" }
